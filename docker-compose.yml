name: storm-panel

# Storm Panel — full stack.
#
#   cp .env.example .env
#   ./scripts/generate-secrets.sh      # fills in the three required secrets
#   docker compose up -d
#
# The `migrate` service runs schema migrations and the seed once, then exits;
# the API and web only start after it succeeds, so a fresh machine comes up
# with a usable panel and no manual steps.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-storm}
      # Faster and safer than the default locale handling for our data.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-storm} -d ${POSTGRES_DB:-storm}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [storm]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [storm]

  # One-shot: migrate the schema and seed reference data, then exit 0.
  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-storm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storm}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    working_dir: /repo/packages/database
    user: root
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        echo "Applying migrations..."
        node ../../node_modules/prisma/build/index.js migrate deploy
        echo "Seeding reference data..."
        node dist/seed/index.js
    depends_on:
      postgres:
        condition: service_healthy
    networks: [storm]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Storm Panel}
      APP_URL: ${APP_URL:?APP_URL is required}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-storm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storm}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Storm Panel <no-reply@localhost>}
      BACKUP_LOCAL_PATH: /var/lib/storm/backups
      AGENT_ALLOW_SELF_SIGNED: ${AGENT_ALLOW_SELF_SIGNED:-false}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      ENABLE_WORKERS: ${ENABLE_WORKERS:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - backup-data:/var/lib/storm/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [storm]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # Next bakes its rewrites at build time, so this is an argument rather
        # than an environment variable. The browser only ever talks to nginx,
        # which routes /api to the API itself; this is for anything that
        # reaches the web container directly.
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks: [storm]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/storm_proxy.conf:/etc/nginx/storm_proxy.conf:ro
      - ./docker/nginx/storm_locations.conf:/etc/nginx/storm_locations.conf:ro
      - ./docker/nginx/cloudflare.conf:/etc/nginx/cloudflare.conf:ro
      - ./docker/nginx/tls.conf:/etc/nginx/tls.conf:ro
      # Drop origin.pem and origin.key in here to serve HTTPS. Empty is fine:
      # the entrypoint script leaves the TLS server off until both exist.
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/entrypoint/40-storm-tls.sh:/docker-entrypoint.d/40-storm-tls.sh:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [storm]

  # Optional S3-compatible storage for backups. Enable with:
  #   docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: [storage]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-storm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-storm-minio-password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [storm]

  # A node agent running on the same host as the panel. For real deployments
  # run the agent on its own machine with scripts/install-node.sh instead.
  #
  #   docker compose --profile agent up -d
  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    profiles: [agent]
    restart: unless-stopped
    # The agent creates sibling containers and must chown files into the
    # unprivileged uid they run as, so it needs the socket and root.
    user: root
    environment:
      NODE_ENV: production
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8081
      PANEL_URL: ${AGENT_PANEL_URL:-http://api:8080}
      # Not marked required here: compose interpolates every service even when
      # the profile is not selected, so `:?` would break a plain `up`. The
      # agent validates these itself and fails with a readable message.
      NODE_UUID: ${AGENT_NODE_UUID:-}
      AGENT_TOKEN_ID: ${AGENT_TOKEN_ID:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_SECRET: ${AGENT_SECRET:-}
      DATA_DIRECTORY: /var/lib/storm/servers
      BACKUP_DIRECTORY: /var/lib/storm/backups
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_NETWORK: storm_net
      SFTP_ENABLED: 'true'
      SFTP_PORT: 2022
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${AGENT_PORT:-8081}:8081'
      - '${AGENT_SFTP_PORT:-2022}:2022'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind mounts, not named volumes: the agent passes these paths to the
      # Docker daemon, which resolves them on the host, not inside this
      # container.
      - ${AGENT_DATA_DIR:-/var/lib/storm/servers}:/var/lib/storm/servers
      - ${AGENT_BACKUP_DIR:-/var/lib/storm/backups}:/var/lib/storm/backups
      - agent-config:/etc/storm
    networks: [storm]

volumes:
  postgres-data:
  redis-data:
  backup-data:
  minio-data:
  agent-config:

networks:
  storm:
    name: storm_panel
    driver: bridge
