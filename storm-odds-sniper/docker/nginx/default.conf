# Ein Origin für Dashboard und API - dadurch braucht der Browser kein CORS
# und der Telegram-Token bleibt ausschließlich serverseitig.

upstream storm_api {
    server api:8000;
    keepalive 16;
}

# Proxy-Grundeinstellungen, die alle weitergeleiteten Routen teilen.
# Die API setzt X-Frame-Options, X-Content-Type-Options und Referrer-Policy
# selbst (für den direkten Zugriff auf Port 8000). Hier werden sie
# ausgeblendet, weil nginx sie ohnehin setzt - sonst stünden sie doppelt in
# der Antwort, und widersprüchliche Mehrfachangaben werden von Browsern
# teilweise komplett ignoriert.
map $host $storm_proxy_dummy { default ""; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------- Header
    # ACHTUNG nginx-Semantik: sobald ein location-Block ein *eigenes*
    # add_header setzt, erbt er KEINEN dieser Header mehr. Deshalb stehen
    # hier alle gemeinsamen Header - inklusive Cache-Control - und die
    # location-Blöcke setzen bewusst keine eigenen.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    # ---------------------------------------------------------- Dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------- API
    # /api/health -> http://api:8000/health
    location /api/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        proxy_pass http://storm_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location = /metrics {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        proxy_pass http://storm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # Swagger UI und ReDoc laden ihre Assets von jsdelivr und starten sich
    # über ein Inline-Script. Die strenge Dashboard-CSP blockiert beides,
    # deshalb gilt für genau diese drei Pfade eine erweiterte Policy.
    #
    # 'unsafe-inline' ist hier eine bewusste, eng begrenzte Ausnahme: die
    # Seite wird von FastAPI selbst erzeugt, zeigt keine Nutzereingaben an
    # und ist nur unter /docs, /redoc und /openapi.json erreichbar. Das
    # Dashboard behält die strenge Policy. Ein Hash statt 'unsafe-inline'
    # wäre strenger, würde aber bei jedem FastAPI-Update stillschweigend
    # brechen. frame-ancestors bleibt in beiden Fällen gesperrt.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

        proxy_pass http://storm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------- WebSocket
    location /ws {
        proxy_pass http://storm_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------- Healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
