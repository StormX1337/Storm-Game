[project]
name = "football-value-scanner"
version = "0.1.0"
description = "Statistical value analysis for football betting markets"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "sqlalchemy==2.0.*",
  "psycopg[binary]==3.2.*",
  "alembic==1.14.*",
  "pydantic-settings==2.6.*",
  "argon2-cffi==23.1.*",
  "cryptography==44.*",
  "redis==5.2.*",
  "httpx==0.28.*",
]

[project.optional-dependencies]
dev = ["pytest==8.3.*", "ruff==0.8.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
