name: STORM BET

on:
  push:
    paths: ['storm-bet/**', '.github/workflows/storm-bet.yml']
  pull_request:
    paths: ['storm-bet/**', '.github/workflows/storm-bet.yml']

concurrency:
  group: storm-bet-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: storm-bet

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: storm-bet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: storm-bet/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stormbet
          POSTGRES_PASSWORD: stormbet
          POSTGRES_DB: stormbet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stormbet" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stormbet:stormbet@localhost:5432/stormbet_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: storm-bet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: storm-bet/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stormbet
          POSTGRES_PASSWORD: stormbet
          POSTGRES_DB: stormbet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stormbet" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stormbet:stormbet@localhost:5432/stormbet?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      # Throwaway values for an ephemeral runner.
      AUTH_SECRET: ci-auth-secret-only-for-ephemeral-e2e-runs-0000
      SEED_ADMIN_PASSWORD: Ci-Admin-Passwort-2026
      SEED_DEMO_PASSWORD: Ci-Demo-Passwort-2026
      E2E_START: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: storm-bet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: storm-bet/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: storm-bet/tests/e2e/playwright-report

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api, worker, web
        run: |
          for target in api worker web; do
            docker build -f docker/Dockerfile --target "$target" -t "storm-bet/$target:ci" .
          done
