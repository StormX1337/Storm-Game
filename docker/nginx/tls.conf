# HTTPS. Enabled by docker-entrypoint.d/40-storm-tls.sh only when a certificate
# and key are actually mounted, so the default HTTP-only deployment still boots.
server {
    # IPv4 only — see the note on the HTTP server.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:storm_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS belongs on the edge that browsers actually talk to. Behind
    # Cloudflare that is Cloudflare, so set it there; sending it from here as
    # well is harmless but redundant, and wrong if you ever serve this origin
    # over plain HTTP for a health check.

    include /etc/nginx/storm_locations.conf;
}
