# Shared proxy headers. The API trusts X-Forwarded-For for rate limiting and
# audit logging, so these must be set consistently on every location.
#
# Headers only, deliberately: this file is included *inside* location blocks,
# and a directive here that a location also sets is a duplicate in the same
# context — which nginx rejects outright, so the container never starts. The
# timeouts live in http{} instead, where a location may override them.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
