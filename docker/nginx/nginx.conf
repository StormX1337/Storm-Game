# Storm Panel reverse proxy.
#
# One origin serves both the panel and the API, which is what makes the
# httpOnly session cookie work without CORS and lets the browser open
# websockets to /api without a second hostname.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format storm '$remote_addr - $status "$request" '
                     '$body_bytes_sent "$http_referer" rt=$request_time';
    access_log /var/log/nginx/access.log storm;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 8g;      # world uploads are genuinely large
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limits: generous for the panel, tighter on authentication.
    limit_req_zone $binary_remote_addr zone=storm_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=storm_auth:10m rate=1r/s;

    upstream storm_api {
        server api:8080;
        keepalive 32;
    }

    upstream storm_web {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Authentication endpoints get their own bucket; a burst allowance
        # keeps a legitimate sign-in from being throttled.
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=storm_auth burst=10 nodelay;
            proxy_pass http://storm_api;
            include /etc/nginx/storm_proxy.conf;
        }

        location /api/ {
            limit_req zone=storm_api burst=60 nodelay;
            proxy_pass http://storm_api;
            include /etc/nginx/storm_proxy.conf;

            # Console and event sockets live under /api and must not be
            # buffered or timed out at the usual 60 seconds.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # The node installer and the agent bundle. A node fetches these before
        # it has any credentials, so they are served straight from the API.
        location /install/ {
            limit_req zone=storm_api burst=10 nodelay;
            proxy_pass http://storm_api;
            include /etc/nginx/storm_proxy.conf;

            # The agent bundle is tens of megabytes; do not buffer it to disk
            # or time it out on a slow link.
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location = /health {
            proxy_pass http://storm_api;
            include /etc/nginx/storm_proxy.conf;
            access_log off;
        }

        location = /ready {
            proxy_pass http://storm_api;
            include /etc/nginx/storm_proxy.conf;
            access_log off;
        }

        location /_next/static/ {
            proxy_pass http://storm_web;
            include /etc/nginx/storm_proxy.conf;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://storm_web;
            include /etc/nginx/storm_proxy.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
