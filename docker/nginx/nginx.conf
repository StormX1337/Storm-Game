# Storm Panel reverse proxy.
#
# One origin serves both the panel and the API, which is what makes the
# httpOnly session cookie work without CORS and lets the browser open
# websockets to /api without a second hostname.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format storm '$remote_addr - $status "$request" '
                     '$body_bytes_sent "$http_referer" rt=$request_time';
    access_log /var/log/nginx/access.log storm;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65;

    # Proxy defaults, inherited by every location so an individual one can
    # raise them (consoles and the agent bundle do) without redefining a
    # directive an include already set.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 8g;      # world uploads are genuinely large
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limits: generous for the panel, tighter on authentication.
    limit_req_zone $binary_remote_addr zone=storm_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=storm_auth:10m rate=1r/s;

    upstream storm_api {
        server api:8080;
        keepalive 32;
    }

    upstream storm_web {
        server web:3000;
        keepalive 32;
    }

    # Real client IPs before anything that keys on them.
    include /etc/nginx/cloudflare.conf;

    server {
        # IPv4 only inside the container: Docker's default bridge has no
        # IPv6, and binding [::] there stops nginx from starting at all.
        # Publishing the port handles the host's IPv6.
        listen 80;
        server_name _;

        include /etc/nginx/storm_locations.conf;
    }

    # The HTTPS server lands here when certificates are mounted.
    include /etc/nginx/conf.d/*.conf;
}
